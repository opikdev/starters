name: Starters

on:
  pull_request:
    paths: [catalog.yaml, scripts/check-starters.sh, .github/workflows/starters.yml]
  push:
    branches: [main]
    paths: [catalog.yaml, scripts/check-starters.sh, .github/workflows/starters.yml]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  starters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall
          install-only: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install the latest pik release
        run: go install github.com/opikdev/pik/cmd/pik@latest
      - name: Generate and check every released starter
        run: scripts/check-starters.sh "$(go env GOPATH)/bin/pik"
