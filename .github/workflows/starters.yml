name: Starters

on:
  pull_request:
    paths: [catalog.yaml, scripts/check-starters.sh, .github/workflows/starters.yml, .github/workflows/check-starters.yml]
  push:
    branches: [main]
    paths: [catalog.yaml, scripts/check-starters.sh, .github/workflows/starters.yml, .github/workflows/check-starters.yml]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  starters:
    uses: ./.github/workflows/check-starters.yml
